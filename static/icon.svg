<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0a13" />
    </linearGradient>
    
    <!-- Neon Glow Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(139, 92, 246, 0.2)" stroke-width="8" />

  <!-- Calendar Icon Container -->
  <g transform="translate(128, 128)" filter="url(#glow)">
    <!-- Calendar Body Outline -->
    <rect x="10" y="40" width="236" height="196" rx="28" fill="none" stroke="url(#neon-grad)" stroke-width="16" />
    
    <!-- Calendar Top Bar -->
    <path d="M 10,90 L 246,90" stroke="url(#neon-grad)" stroke-width="16" stroke-linecap="round" />
    
    <!-- Calendar Rings -->
    <rect x="50" y="10" width="16" height="40" rx="8" fill="url(#neon-grad)" />
    <rect x="190" y="10" width="16" height="40" rx="8" fill="url(#neon-grad)" />
    
    <!-- Sparkles / Star in the center representing AI -->
    <path d="M 128,115 L 134,133 L 152,133 L 138,145 L 143,163 L 128,151 L 113,163 L 118,145 L 104,133 L 122,133 Z" fill="url(#neon-grad)" />
    <circle cx="70" cy="140" r="8" fill="#a78bfa" />
    <circle cx="186" cy="140" r="8" fill="#a78bfa" />
    <circle cx="70" cy="180" r="8" fill="#a78bfa" />
    <circle cx="128" cy="180" r="8" fill="#a78bfa" />
    <circle cx="186" cy="180" r="8" fill="#a78bfa" />
  </g>
</svg>
